  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((err) => {
            console.warn("[SW] Registration failed:", err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
